name: CD Ephemeral Destroy

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cd-ephemeral-destroy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  destroy-ephemeral:
    name: Destroy Ephemeral (${{ github.head_ref }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sanitize branch name
        run: |
          SANITIZED=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-40)
          echo "STACK_SUFFIX=-$SANITIZED" >> "$GITHUB_ENV"
          echo "SANITIZED_BRANCH=$SANITIZED" >> "$GITHUB_ENV"
        shell: bash

      - name: Check stack existence
        id: stack-check
        run: |
          STACK_NAME="FrecuenciaColectivaStack${{ env.STACK_SUFFIX }}"
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "${{ secrets.AWS_REGION }}" --output text > /dev/null 2>&1; then
            echo "STACK_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "STACK_EXISTS=false" >> "$GITHUB_ENV"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Setup Python
        if: env.STACK_EXISTS == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CDK
        if: env.STACK_EXISTS == 'true'
        run: pip install -r backend/requirements.txt

      - name: Setup Node.js for backend
        if: env.STACK_EXISTS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Build backend TypeScript
        if: env.STACK_EXISTS == 'true'
        run: |
          cd backend
          npm ci
          npm run build

      - name: Destroy CDK stack
        if: env.STACK_EXISTS == 'true'
        run: |
          cd backend
          npx cdk destroy --all --force --ci
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          STACK_SUFFIX: ${{ env.STACK_SUFFIX }}
          AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

      - name: Comment PR — destroyed
        if: env.STACK_EXISTS == 'true'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🧹 Ephemeral environment **${{ env.SANITIZED_BRANCH }}** has been destroyed."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Comment PR — nothing to destroy
        if: env.STACK_EXISTS == 'false'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "ℹ️ No ephemeral environment found for branch **${{ env.SANITIZED_BRANCH }}** — nothing to destroy."
        env:
          GH_TOKEN: ${{ github.token }}
